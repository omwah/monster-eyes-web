<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monster Eyes</title>
<!-- build:css -->
<link rel="stylesheet" href="style.css">
<!-- /build:css -->
</head>
<body>
<div id="stage"><div id="ring"></div></div>

<div id="bar" role="toolbar" aria-label="Eye controls">
  <div id="picker" role="dialog" aria-label="Eyes" hidden>
    <div class="pick-head">
      <span id="pick-count"></span>
      <button id="pick-all" title="Check every eye">All</button>
      <button id="pick-none" title="Uncheck every eye but the one showing">None</button>
    </div>
    <ul id="pick-list"></ul>
    <div class="pick-foot">
      <div class="pick-setting">
        <span class="label">Show each eye</span>
        <div class="seg" role="group" aria-label="Show each eye for">
          <button data-interval="0" title="Keep showing the same eye">Always</button>
          <button data-interval="30">30 s</button>
          <button data-interval="60">1 min</button>
          <button data-interval="120">2 min</button>
          <button data-interval="300">5 min</button>
        </div>
      </div>
      <div class="pick-setting">
        <span class="label">Order</span>
        <div class="seg" role="group" aria-label="Slideshow order">
          <button data-order="order" title="Down the list">In order</button>
          <button data-order="random" title="Shuffled, with no eye twice in a row">Random</button>
        </div>
      </div>
    </div>
  </div>
  <div class="group">
    <button id="prev" class="icon" title="Previous eyes (←)" aria-label="Previous eyes">◀</button>
    <button id="pkg" class="pkg" title="Choose eyes" aria-haspopup="true" aria-expanded="false"><span id="pkg-name">—</span> <span id="pkg-badge" hidden></span> <span aria-hidden="true">▾</span></button>
    <button id="next" class="icon" title="Next eyes (→)" aria-label="Next eyes">▶</button>
  </div>
  <div class="group">
    <span class="label">Eyes</span>
    <div class="seg" role="group" aria-label="Number of eyes">
      <button id="count-auto" title="As the eye package wants (A)">Auto</button>
      <button id="count-1" title="One eye (1)">1</button>
      <button id="count-2" title="Two eyes (2)">2</button>
    </div>
  </div>
  <div class="group">
    <span class="label">Size</span>
    <button id="smaller" class="icon" title="Smaller (−)" aria-label="Smaller">−</button>
    <button id="bigger" class="icon" title="Bigger (+)" aria-label="Bigger">+</button>
    <button id="center" title="Put the eyes back in the middle, keeping their sizes (C)">Center</button>
    <button id="fit" title="Back to the fitted size and position (0)">Fit</button>
    <button id="separate" title="Drag and resize one eye at a time instead of the pair (S, or hold Shift)">Adjust separately</button>
  </div>
  <div class="group">
    <button id="follow" title="Eyes follow the mouse or a finger (M)">Follow</button>
    <button id="blink" title="Blink now and then on their own (B). Click an eye or press Space to blink once">Auto-blink</button>
    <button id="add" title="Add eye folders from this computer">Add eyes…</button>
    <button id="fullscreen" title="Full screen (F)">Full screen</button>
    <button id="fps-toggle" title="Show the frame rate (I)">FPS</button>
  </div>
</div>

<input id="folder" type="file" webkitdirectory directory multiple hidden>
<div id="toast" role="status" aria-live="polite"></div>
<div id="drop">Drop eye folders here</div>
<div id="fps"></div>

<!-- build:js -->
<script src="../build/eyes-data.js"></script>
<script src="eyes-assets.js"></script>
<script src="eyes-renderer.js"></script>
<script src="app.js"></script>
<!-- /build:js -->
</body>
</html>
